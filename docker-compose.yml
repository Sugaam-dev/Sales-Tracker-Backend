services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sales_tracker_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"

  # Local Postgres container (only needed for offline local development without Supabase)
  # To run with local postgres: docker compose --profile local-db up -d
  postgres:
    image: postgres:16-alpine
    container_name: sales_tracker_postgres
    restart: unless-stopped
    profiles:
      - local-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
